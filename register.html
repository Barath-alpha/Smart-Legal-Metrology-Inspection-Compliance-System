<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Officer Registration | Smart Legal Metrology Inspection &amp; Compliance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body style="background:linear-gradient(135deg, #091e3a 0%, #17375e 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width:580px; width:100%;">
    <div class="card-header text-center py-4 bg-white border-bottom">
      <div class="sidebar-brand-logo mx-auto mb-2" style="width:52px; height:52px; font-size:1.6rem;">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Officer Registration</h4>
      <p class="text-muted small mb-0">Legal Metrology Directorate Authorization</p>
    </div>
    <div class="card-body p-4 p-md-5">
      <form id="standalone-register-form">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label-gov">Full Officer Name</label>
            <input type="text" id="sr-name" class="form-control form-control-gov" placeholder="Rajesh Sharma" required />
          </div>
          <div class="col-md-6">
            <label class="form-label-gov">Employee / Inspector ID</label>
            <input type="text" id="sr-empid" class="form-control form-control-gov" placeholder="EMP-8842" required />
          </div>
          <div class="col-12">
            <label class="form-label-gov">Official Government Email</label>
            <input type="email" id="sr-email" class="form-control form-control-gov" placeholder="name@metrology.gov.in" required />
          </div>
          <div class="col-md-6">
            <label class="form-label-gov">Password</label>
            <input type="password" id="sr-pass" class="form-control form-control-gov" placeholder="••••••••" required />
          </div>
          <div class="col-md-6">
            <label class="form-label-gov">Role</label>
            <select id="sr-role" class="form-select form-control-gov">
              <option value="Inspector">Inspector</option>
              <option value="Senior Inspector">Senior Inspector</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-gov btn-gov-primary w-100 py-2 fw-bold mt-4">
          <i class="bi bi-shield-check"></i> Register &amp; Enter Portal
        </button>
      </form>
      <div class="mt-3 pt-2 border-top text-center small text-muted">
        Already authorized? <a href="login.html" class="fw-bold">Sign In here</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('standalone-register-form').onsubmit = async (e) => {
      e.preventDefault();
      const res = await Auth.register({
        name: document.getElementById('sr-name').value,
        employeeId: document.getElementById('sr-empid').value,
        email: document.getElementById('sr-email').value,
        password: document.getElementById('sr-pass').value,
        role: document.getElementById('sr-role').value
      });
      if (res.success) {
        window.location.href = 'index.html#dashboard';
      } else {
        alert(res.error || 'Registration failed.');
      }
    };
  </script>
</body>
</html>
