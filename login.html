<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorized Sign In | Smart Legal Metrology Inspection &amp; Compliance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body style="background:linear-gradient(135deg, #091e3a 0%, #17375e 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width:460px; width:100%;">
    <div class="card-header text-center py-4 bg-white border-bottom">
      <div class="sidebar-brand-logo mx-auto mb-2" style="width:52px; height:52px; font-size:1.6rem;">
        <i class="bi bi-shield-check"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Legal Metrology Portal</h4>
      <p class="text-muted small mb-0">Government Packaged Commodities Inspection System</p>
    </div>
    <div class="card-body p-4 p-md-5">
      <form id="standalone-login-form">
        <div class="form-group mb-3">
          <label class="form-label-gov" for="s-login-email">Official Email / Inspector ID</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
            <input type="email" id="s-login-email" class="form-control form-control-gov" value="inspector@metrology.gov.in" required />
          </div>
        </div>
        <div class="form-group mb-3">
          <label class="form-label-gov" for="s-login-password">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="s-login-password" class="form-control form-control-gov" value="inspector123" required />
          </div>
        </div>
        <button type="submit" class="btn btn-gov btn-gov-primary w-100 py-2 fw-bold mt-2">
          <i class="bi bi-box-arrow-in-right"></i> Authorize &amp; Enter Portal
        </button>
      </form>
      <div class="mt-4 pt-3 border-top text-center small text-muted">
        Need official credentials? <a href="register.html" class="fw-bold">Register Officer</a>
        <div class="mt-2">
          <a href="home.html" class="text-secondary text-decoration-none"><i class="bi bi-house-door me-1"></i> Return to Official Home Portal</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('standalone-login-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('s-login-email').value;
      const pass = document.getElementById('s-login-password').value;
      const res = await Auth.login(email, pass);
      if (res.success) {
        window.location.href = 'index.html#dashboard';
      } else {
        alert(res.error || 'Authentication failed.');
      }
    };
  </script>
</body>
</html>
