<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#sealGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="#0f2942" stroke="url(#sealGold)" stroke-width="2"/>
  
  <!-- Star accents -->
  <polygon points="100,22 103,30 111,30 105,35 107,43 100,38 93,43 95,35 89,30 97,30" fill="#f59e0b"/>
  <polygon points="100,178 103,170 111,170 105,165 107,157 100,162 93,157 95,165 89,170 97,170" fill="#f59e0b"/>

  <!-- Inner Crest Outline -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M100 45 L118 78 L154 78 L125 100 L136 134 L100 112 L64 134 L75 100 L46 78 L82 78 Z" fill="#f59e0b" opacity="0.2"/>

  <!-- Central Shield -->
  <path d="M75 68 Q100 60 125 68 L125 108 Q100 140 75 108 Z" fill="#1e3a8a" stroke="#f59e0b" stroke-width="2"/>
  <path d="M88 95 L96 103 L114 85" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Curved Text Top & Bottom -->
  <path id="curveTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="curveBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="900" fill="#fef3c7" letter-spacing="2">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">LEGAL METROLOGY &bull; LMPC</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#fef3c7" letter-spacing="1.5">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">GOVERNMENT OF INDIA</textPath>
  </text>
</svg>
