<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sealNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f36"/>
      <stop offset="100%" stop-color="#091e3a"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Rings -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#sealGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="url(#sealNavy)" stroke="url(#sealGold)" stroke-width="2"/>
  
  <!-- Subtle Guilloche / Beaded Ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Star Accents -->
  <polygon points="100,21 102.5,27.5 109.5,27.5 104,31.5 106,38 100,34 94,38 96,31.5 90.5,27.5 97.5,27.5" fill="#f59e0b"/>
  <polygon points="100,179 102.5,172.5 109.5,172.5 104,168.5 106,162 100,166 94,162 96,168.5 90.5,172.5 97.5,172.5" fill="#f59e0b"/>

  <!-- Inner Crest Outline -->
  <circle cx="100" cy="100" r="58" fill="#152e4d" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Balance Beam & Weights Iconography (Legal Metrology Emblem) -->
  <!-- Central Pillar -->
  <rect x="98" y="65" width="4" height="60" rx="2" fill="#fde68a"/>
  <!-- Base -->
  <path d="M85 125 L115 125 L110 132 L90 132 Z" fill="#f59e0b"/>
  <!-- Top Fulcrum Beam -->
  <rect x="68" y="68" width="64" height="4" rx="2" fill="#f59e0b"/>
  <circle cx="100" cy="70" r="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- Left Pan -->
  <line x1="72" y1="72" x2="64" y2="92" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="72" y1="72" x2="80" y2="92" stroke="#fde68a" stroke-width="1.5"/>
  <path d="M60 92 Q72 102 84 92 Z" fill="#f59e0b" stroke="#fde68a" stroke-width="1"/>

  <!-- Right Pan -->
  <line x1="128" y1="72" x2="120" y2="92" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="128" y1="72" x2="136" y2="92" stroke="#fde68a" stroke-width="1.5"/>
  <path d="M116 92 Q128 102 140 92 Z" fill="#f59e0b" stroke="#fde68a" stroke-width="1"/>

  <!-- Verification Checkmark Badge -->
  <circle cx="100" cy="106" r="11" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M96 106 L99 109 L105 103" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Curved Text Top & Bottom -->
  <path id="curveTop" d="M 28,100 A 72,72 0 0,1 172,100" fill="none"/>
  <path id="curveBottom" d="M 172,100 A 72,72 0 0,1 28,100" fill="none"/>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="800" fill="#fef3c7" letter-spacing="1.8">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">LEGAL METROLOGY &bull; DIGITAL PLATFORM</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#fde68a" letter-spacing="1.2">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">INSPECTION &amp; COMPLIANCE SYSTEM</textPath>
  </text>
</svg>
