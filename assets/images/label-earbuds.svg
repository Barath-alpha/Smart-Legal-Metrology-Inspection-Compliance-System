  <text x="400" y="95" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">Active Noise Cancellation &bull; 40H Battery Life &bull; Bluetooth 5.4</text>

  <!-- Barcode -->
  <rect x="620" y="125" width="130" height="50" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <g fill="#0f172a">
    <rect x="630" y="132" width="3" height="28"/>
    <rect x="636" y="132" width="5" height="28"/>
    <rect x="644" y="132" width="2" height="28"/>
    <rect x="650" y="132" width="5" height="28"/>
    <rect x="658" y="132" width="3" height="28"/>
    <rect x="665" y="132" width="6" height="28"/>
    <rect x="675" y="132" width="3" height="28"/>
    <rect x="682" y="132" width="4" height="28"/>
    <rect x="692" y="132" width="6" height="28"/>
    <rect x="702" y="132" width="3" height="28"/>
    <rect x="710" y="132" width="4" height="28"/>
    <text x="685" y="170" font-family="monospace" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">8909988776611</text>
  </g>

  <!-- PDP Panel -->
  <rect x="50" y="175" width="700" height="305" fill="#ffffff" rx="8" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="175" width="700" height="32" fill="#f1f5f9" rx="8"/>
  <text x="65" y="196" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#334155">ELECTRONIC APPLIANCE STATUTORY DECLARATION (LMPC RULES, 2011)</text>

  <!-- Field 1: Commodity Title & Package Contents -->
  <text x="70" y="230" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Generic Name:</text>
  <text x="260" y="230" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#334155">True Wireless Stereo (TWS) Earbuds (Contains: 1 Pair Earbuds, 1 Charging Case, 1 USB-C Cable)</text>

  <!-- Field 2: Net Quantity in Number -->
  <text x="70" y="265" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Net Quantity:</text>
  <text x="260" y="265" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">1 Unit (1 N)</text>
  <text x="360" y="265" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#64748b">[Unit Sale Price: ₹ 1,999.00 / N]</text>

  <!-- Field 3: Marketed By -->
  <text x="70" y="300" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Marketed By:</text>
  <text x="260" y="300" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#334155">SoundMax Digital Ltd, 804 Cyber City, DLF Phase II, Gurugram - 122002, Haryana</text>

  <!-- Field 4: Missing Origin Violation (VIOLATION ALERT) -->
  <rect x="65" y="318" width="670" height="42" fill="#fee2e2" rx="6" stroke="#ef4444" stroke-width="1.5"/>
  <text x="75" y="338" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#dc2626">Country of Origin:</text>
  <text x="260" y="338" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">[MISSING / NOT DECLARED ON PACKAGE]</text>
  <text x="260" y="353" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">⚠️ [NON-COMPLIANT: Rule 6(1)(g) violation - Mandatory declaration of origin omitted]</text>

  <!-- Field 5: MRP -->
  <text x="70" y="385" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">MRP (Incl. of all taxes):</text>
  <text x="260" y="385" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#0f172a">₹ 1,999.00 (Inclusive of all taxes)</text>

