  <text x="70" y="420" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Month of Import:</text>
  <text x="260" y="420" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#334155">08 / 2026</text>

