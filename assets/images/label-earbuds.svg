  <text x="70" y="455" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Consumer Care Cell:</text>
  <text x="260" y="455" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#334155">Email: support@soundmaxaudio.in | Tel: +91-124-4890000 | Toll Free: 1800-889-7700</text>
