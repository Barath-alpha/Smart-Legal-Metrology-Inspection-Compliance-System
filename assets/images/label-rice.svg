  <text x="400" y="95" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="#fef9c3" text-anchor="middle">Aged Long Grain Traditional Basmati Rice &bull; Premium Export Quality</text>

  <!-- Barcode -->
  <rect x="620" y="125" width="130" height="50" fill="#ffffff" stroke="#ca8a04" rx="4"/>
  <g fill="#713f12">
    <rect x="630" y="132" width="3" height="28"/>
    <rect x="636" y="132" width="5" height="28"/>
    <rect x="644" y="132" width="2" height="28"/>
    <rect x="650" y="132" width="5" height="28"/>
